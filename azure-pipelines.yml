trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '22.x'
  buildArtifactName: 'ctos-web-build'
  slotName: 'pipeline-development-experiment'
  appName: 'ctosdev-web-sandbox'
  resourceGroup: 'CUS-RG-Dev-Main'

stages:
- stage: Build
  displayName: 'Build Application'
  jobs:
  - job: BuildJob
    displayName: 'Build and Package'
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: $(nodeVersion)
          checkLatest: true

      - script: |
          npm install
          npm run build
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
        displayName: 'Install & Build & Prepare Standalone'

      - task: ArchiveFiles@2
        inputs:
          rootFolderOrFile: '.next/standalone'
          includeRootFolder: false
          archiveType: 'zip'
          archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
          replaceExistingArchive: true

      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/app.zip'
          artifact: $(buildArtifactName)

- stage: Deploy
  displayName: 'Deploy to Azure Slot'
  dependsOn: Build
  jobs:
  - deployment: DeployJob
    displayName: 'Deploy to Azure App Service Slot'
    environment: 'Development'
    strategy:
      runOnce:
        deploy:
          steps:
            - task: DownloadPipelineArtifact@2
              inputs:
                artifactName: $(buildArtifactName)
                path: '$(Pipeline.Workspace)'

            - task: AzureWebApp@1
              inputs:
                azureSubscription: 'Enterprise Dev/Test'
                appType: 'webAppLinux'
                appName: $(appName)
                package: '$(Pipeline.Workspace)/app.zip'
                deployToSlotOrASE: true
                resourceGroupName: $(resourceGroup)
                slotName: $(slotName)
