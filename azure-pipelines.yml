# Trigger pipeline on main branch
trigger:
  branches:
    include:
      - main
pr:
  branches:
    include:
      - main

variables:
  nodeVersion: '22.x'
  buildArtifactName: 'ctos-web-build'

stages:
- stage: Build
  displayName: 'Build Application'
  jobs:
  - job: BuildJob
    displayName: 'Build and package the app'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: NodeTool@0
      displayName: 'Setup Node.js'
      inputs:
        versionSpec: $(nodeVersion)

    - script: |
        npm ci
        npm run build
      displayName: 'Install dependencies and build'

    - task: ArchiveFiles@2
      displayName: 'Zip entire app for deployment'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
        replaceExistingArchive: true

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Build Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/app.zip'
        artifact: $(buildArtifactName)

- stage: DeployDevelopment
  displayName: 'Deploy to Development Slot'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployJob
    displayName: 'Deploy to Azure Slot'
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'development'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadPipelineArtifact@2
            displayName: 'Download Build Artifact'
            inputs:
              artifactName: $(buildArtifactName)
              path: '$(Pipeline.Workspace)'

          - task: AzureWebApp@1
            displayName: 'Deploy to Azure Web App Slot'
            inputs:
              azureSubscription: 'Enterprise Dev/Test'
              appType: 'webAppLinux'
              appName: 'ctosdev-web-sandbox'
              slotName: 'ctosdev-web-sandbox-pipeline-development-experiment'
              package: '$(Pipeline.Workspace)/$(buildArtifactName)/app.zip'
